name: Nightly CLI drift
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the newest CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex || true
          curl -fsS https://cursor.com/install | bash || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: drift
        run: node scripts/check-drift.mjs | tee drift.txt
        continue-on-error: true
      - name: Open an issue when a flag disappeared
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "CLI drift detected $(date -u +%F)" --body-file drift.txt
