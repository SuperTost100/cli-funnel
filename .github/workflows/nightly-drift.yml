name: Nightly CLI drift
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the newest CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex || true
          curl -fsS https://cursor.com/install | bash || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Antigravity has no documented non-interactive installer, so the job skips it and says so in the log.
      # A failed install of the other three fails the check instead of being skipped.
      - id: drift
        shell: bash
        env:
          DRIFT_REQUIRE: claude,codex,agent
        run: |
          set -o pipefail
          node scripts/check-drift.mjs | tee drift.txt
        continue-on-error: true
      - name: Open an issue when a flag disappeared
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "CLI drift detected $(date -u +%F)" --body-file drift.txt
